swagger: "2.0"
info:
  title: CouponPilot mobile API
  description: Firebase-authenticated iOS gateway for the private CouponPilot Cloud Run service.
  version: "1.0.0"
schemes: [https]
produces: [application/json]
securityDefinitions:
  firebase:
    type: oauth2
    flow: implicit
    authorizationUrl: ""
    x-google-issuer: https://securetoken.google.com/proj-aj21-211200020328
    x-google-jwks_uri: https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
    x-google-audiences: proj-aj21-211200020328
paths:
  /v1/stores/nearby:
    get:
      operationId: nearbyStores
      security: [{firebase: []}]
      x-google-backend:
        address: https://coupon-pilot-api-akcfigyefa-du.a.run.app
        jwt_audience: https://coupon-pilot-api-akcfigyefa-du.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
      responses: {"200": {description: OK}}
  /v1/coupons/normalize:
    post:
      operationId: normalizeCoupon
      security: [{firebase: []}]
      x-google-backend:
        address: https://coupon-pilot-api-akcfigyefa-du.a.run.app
        jwt_audience: https://coupon-pilot-api-akcfigyefa-du.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses: {"200": {description: OK}}
  /v1/cards/recognize:
    post:
      operationId: recognizeSanitizedCard
      description: >-
        Explicitly consented Gemini catalog classification. Accepts secret-free iOS OCR plus only
        a front visual signature whose text and lower sensitive half were pixel-masked and Vision
        rechecked on device. DLP redacts all text once more before Gemini. Original card photos,
        the back image, PAN, expiry and CVC are rejected.
      security: [{firebase: []}]
      x-google-backend:
        address: https://coupon-pilot-api-akcfigyefa-du.a.run.app
        jwt_audience: https://coupon-pilot-api-akcfigyefa-du.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 30.0
      responses:
        "200": {description: User-confirmable allowlisted card product and official source links}
        "400": {description: Sensitive or malformed card recognition input}
        "503": {description: Vertex card recognition is not configured}
  /v1/benefits/search:
    get:
      operationId: searchBenefits
      security: [{firebase: []}]
      x-google-backend:
        address: https://coupon-pilot-api-akcfigyefa-du.a.run.app
        jwt_audience: https://coupon-pilot-api-akcfigyefa-du.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses: {"200": {description: OK}}
  /v1/recommendations:
    post:
      operationId: recommendations
      security: [{firebase: []}]
      x-google-backend:
        address: https://coupon-pilot-api-akcfigyefa-du.a.run.app
        jwt_audience: https://coupon-pilot-api-akcfigyefa-du.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses: {"200": {description: OK}}
