<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1320" viewBox="0 0 2000 1320">
  <rect width="2000" height="1320" fill="#ffffff"/>
  <style>
    .title{font:700 38px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#0f2747}
    .sub{font:400 19px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#64748b}
    .head{font:700 22px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#12315b}
    .field{font:400 16px Menlo,Consolas,monospace;fill:#334155}
    .key{font:700 14px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#0f766e}
    .rel{font:500 15px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#475569}
    .box{fill:#f8fbff;stroke:#88aee8;stroke-width:2}
    .boxhead{fill:#eaf2ff}
    .line{stroke:#5b8bd9;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#5b8bd9;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b8bd9"/></marker>
  </defs>
  <text x="80" y="70" class="title">쿠폰콕 데이터 모델 (ERD)</text>
  <text x="80" y="104" class="sub">Firestore 사용자·쿠폰·매장 데이터와 Cloud Storage 기반 통신사 혜택 RAG 지식 구조</text>

  <!-- UserProfile -->
  <g transform="translate(80 160)">
    <rect class="box" width="265" height="190" rx="16"/>
    <rect class="boxhead" width="265" height="48" rx="16"/><rect class="boxhead" y="32" width="265" height="16"/>
    <text x="18" y="31" class="head">UserProfile</text>
    <text x="18" y="76" class="field">userId</text><text x="196" y="76" class="key">PK</text>
    <text x="18" y="102" class="field">carrier</text>
    <text x="18" y="128" class="field">membershipGrade</text>
    <text x="18" y="154" class="field">monthlyBenefitUsed</text>
    <text x="18" y="180" class="field">updatedAt</text>
  </g>

  <!-- Coupon -->
  <g transform="translate(430 145)">
    <rect class="box" width="310" height="390" rx="16"/>
    <rect class="boxhead" width="310" height="48" rx="16"/><rect class="boxhead" y="32" width="310" height="16"/>
    <text x="18" y="31" class="head">Coupon</text>
    <text x="18" y="76" class="field">couponId</text><text x="235" y="76" class="key">PK</text>
    <text x="18" y="102" class="field">userId</text><text x="235" y="102" class="key">FK</text>
    <text x="18" y="128" class="field">brand / title</text>
    <text x="18" y="154" class="field">barcodeValue</text>
    <text x="18" y="180" class="field">discountType / value</text>
    <text x="18" y="206" class="field">minimumOrderAmount</text>
    <text x="18" y="232" class="field">expiresAt</text>
    <text x="18" y="258" class="field">status</text>
    <text x="18" y="284" class="field">ocrRawText</text>
    <text x="18" y="310" class="field">createdAt</text>
    <line x1="18" y1="329" x2="292" y2="329" stroke="#cbd5e1"/>
    <text x="18" y="358" class="sub">원본 쿠폰 이미지는 iPhone 기기 내 보관</text>
  </g>

  <!-- Store -->
  <g transform="translate(820 160)">
    <rect class="box" width="300" height="285" rx="16"/>
    <rect class="boxhead" width="300" height="48" rx="16"/><rect class="boxhead" y="32" width="300" height="16"/>
    <text x="18" y="31" class="head">Store</text>
    <text x="18" y="76" class="field">storeId</text><text x="226" y="76" class="key">PK</text>
    <text x="18" y="102" class="field">name / brand</text>
    <text x="18" y="128" class="field">address</text>
    <text x="18" y="154" class="field">latitude / longitude</text>
    <text x="18" y="180" class="field">businessStatus</text>
    <text x="18" y="206" class="field">source</text>
    <text x="18" y="232" class="field">updatedAt</text>
    <text x="18" y="265" class="sub">data.go.kr 수원 매장 데이터</text>
  </g>

  <!-- RecommendationLog -->
  <g transform="translate(1250 145)">
    <rect class="box" width="330" height="285" rx="16"/>
    <rect class="boxhead" width="330" height="48" rx="16"/><rect class="boxhead" y="32" width="330" height="16"/>
    <text x="18" y="31" class="head">RecommendationLog</text>
    <text x="18" y="76" class="field">recommendationId</text><text x="255" y="76" class="key">PK</text>
    <text x="18" y="102" class="field">userId / storeId / couponId</text><text x="286" y="102" class="key">FK</text>
    <text x="18" y="128" class="field">expectedPrice</text>
    <text x="18" y="154" class="field">calculatedSavings</text>
    <text x="18" y="180" class="field">recommendedOption</text>
    <text x="18" y="206" class="field">createdAt</text>
    <text x="18" y="258" class="sub">매장 진입 시 추천 결과 이력</text>
  </g>

  <!-- CouponUsage -->
  <g transform="translate(1250 555)">
    <rect class="box" width="330" height="250" rx="16"/>
    <rect class="boxhead" width="330" height="48" rx="16"/><rect class="boxhead" y="32" width="330" height="16"/>
    <text x="18" y="31" class="head">CouponUsage</text>
    <text x="18" y="76" class="field">usageId</text><text x="255" y="76" class="key">PK</text>
    <text x="18" y="102" class="field">couponId / userId / storeId</text><text x="286" y="102" class="key">FK</text>
    <text x="18" y="128" class="field">usedAt</text>
    <text x="18" y="154" class="field">finalPrice</text>
    <text x="18" y="180" class="field">savings</text>
    <text x="18" y="223" class="sub">사용 완료·절약 금액 이력</text>
  </g>

  <!-- BenefitDocument -->
  <g transform="translate(260 780)">
    <rect class="box" width="330" height="230" rx="16"/>
    <rect class="boxhead" width="330" height="48" rx="16"/><rect class="boxhead" y="32" width="330" height="16"/>
    <text x="18" y="31" class="head">BenefitDocument</text>
    <text x="18" y="76" class="field">documentId</text><text x="255" y="76" class="key">PK</text>
    <text x="18" y="102" class="field">provider</text>
    <text x="18" y="128" class="field">sourceURL</text>
    <text x="18" y="154" class="field">collectedAt</text>
    <text x="18" y="180" class="field">updatedAt</text>
    <text x="18" y="213" class="sub">Cloud Storage 공식 혜택 문서</text>
  </g>

  <!-- BenefitChunk -->
  <g transform="translate(760 760)">
    <rect class="box" width="340" height="280" rx="16"/>
    <rect class="boxhead" width="340" height="48" rx="16"/><rect class="boxhead" y="32" width="340" height="16"/>
    <text x="18" y="31" class="head">BenefitChunk</text>
    <text x="18" y="76" class="field">chunkId</text><text x="265" y="76" class="key">PK</text>
    <text x="18" y="102" class="field">documentId</text><text x="265" y="102" class="key">FK</text>
    <text x="18" y="128" class="field">text</text>
    <text x="18" y="154" class="field">embeddingRef</text>
    <text x="18" y="180" class="field">brand</text>
    <text x="18" y="206" class="field">carrier</text>
    <text x="18" y="252" class="sub">RAG 검색 근거·원문 링크 반환</text>
  </g>

  <!-- relations -->
  <path class="line" d="M345 245 H430"/><text x="355" y="232" class="rel">owns 1:N</text>
  <path class="line" d="M345 305 C650 305 950 470 1250 635"/><text x="640" y="405" class="rel">records 1:N</text>
  <path class="line" d="M740 330 C930 330 1050 275 1250 275"/><text x="970" y="258" class="rel">candidate 1:N</text>
  <path class="line" d="M1120 285 H1250"/><text x="1138" y="272" class="rel">triggers 1:N</text>
  <path class="line" d="M740 455 C945 455 1040 560 1250 660"/><text x="938" y="530" class="rel">usage 1:N</text>
  <path class="line" d="M1120 385 C1180 420 1200 540 1250 620"/><text x="1135" y="472" class="rel">used_at 1:N</text>
  <path class="dash" d="M590 895 H760"/><text x="618" y="880" class="rel">split_into 1:N</text>

  <rect x="80" y="1120" width="1500" height="110" rx="18" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2"/>
  <text x="110" y="1163" class="head">저장 경계</text>
  <text x="110" y="1200" class="sub">쿠폰 원본 이미지: iPhone 로컬 저장 · Firestore: 사용자별 구조화 쿠폰/프로필/사용 이력 · Cloud Storage: 공식 통신사 혜택 문서</text>
</svg>
